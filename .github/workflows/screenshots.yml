name: Capture demo screenshots

# The six images /platform on bis-rgv.com is waiting for.
#
# A button for the same reason the seeder has one: this needs the Clerk AND
# Supabase secrets plus a production build, all of which already exist on a
# runner and none of which exist on a phone. The captures come back as an
# artifact rather than being committed — this repo has no use for them; the
# website does.
on:
  workflow_dispatch:
    inputs:
      reseed:
        description: 'Re-seed the demo first (recommended — every timestamp is anchored to the seed)'
        type: boolean
        default: true

# Takes the e2e job's OWN lock. This drives a browser through the shared
# Supabase project and, when re-seeding, rewrites a whole account in it.
concurrency:
  group: e2e-shared-supabase
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The three Supabase secrets below are production's and are held by the
    # `production` environment (main only), not the repository. The two Clerk
    # keys are still the repository's development-instance keys.
    #
    # KNOWN BROKEN since 2026-10-07: this signs in through the Clerk
    # development instance, which production no longer trusts, so the
    # capture cannot sign in. Fixing it needs production Clerk credentials
    # held in this environment under their own names (never the repository's
    # dev-instance CLERK_SECRET_KEY / NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, which
    # the CI gates read), and a sign-in identity on the production instance
    # for the demo tenant. Until then a run fails at its sign-in step.
    environment: production
    env:
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_h2GmSCjLzD74RotkQAvMbA_BL6FAI4k
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check that the repository secrets are configured
        run: |
          missing=""
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing (the Supabase ones belong to the production environment, the Clerk ones to the repository)"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Default on, because a capture of a stale demo is a dashboard whose
      # "this week" panels are honestly empty — the product looking broken.
      - name: Re-seed the demo tenant
        if: ${{ inputs.reseed }}
        run: pnpm --filter @bis/db db:seed-demo

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The config's webServer builds and starts the app itself.
      - name: Capture
        run: pnpm --filter web screenshots

      # The PNGs only: pixels of the seeded, outbound-suppressed demo tenant,
      # made for the public website. The signed-in session that took them is
      # in screenshots/.auth/, outside this directory, and stays on the runner.
      #
      # NO TRACE UPLOAD (2026-10-07), for the reason ci.yml's e2e job gives:
      # the repo is public, so are its artifacts, and a trace carries session
      # cookies and network bodies. A failed capture is read from the
      # Capture step's log, or reproduced locally with
      # `pnpm --filter web screenshots` (traces land in apps/web/test-results/).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-screenshots
          path: apps/web/screenshots/out/
          if-no-files-found: error
          retention-days: 14
