name: Capture demo screenshots

# The six images /platform on bis-rgv.com is waiting for.
#
# A button for the same reason the seeder has one: this needs the Clerk AND
# Supabase secrets plus a production build, all of which already exist on a
# runner and none of which exist on a phone. The captures come back as an
# artifact rather than being committed — this repo has no use for them; the
# website does.
on:
  workflow_dispatch:
    inputs:
      reseed:
        description: 'Re-seed the demo first (recommended — every timestamp is anchored to the seed)'
        type: boolean
        default: true

# Runs on the CI Supabase project, not production (2026-10-08). The demo
# tenant is fiction, so it never needed production's database, and production
# no longer accepts the development Clerk instance's tokens: the 5 AM capture
# that day photographed four "Something went wrong" screens because every
# user-scoped read was refused. Since #189 each CI run mints a development
# agency_admin user, so production trusting that instance would hand those
# users production's data; it must not. The CI project trusts exactly that
# instance, and so does this capture now.
#
# Takes ci.yml's e2e lock, `e2e-ci-supabase`, queued and never cancelled:
# this drives a browser through the CI project and, when re-seeding,
# rewrites a whole account in it, so it must neither run beside an e2e job
# nor knock one out of the queue. (`e2e-shared-supabase`, the name this file
# used to take, is production's old lock; ci.yml left it in #194.) A job
# holds one group, so a re-seed can overlap a `verify` job: accepted, since
# the capture runs rarely, the seeder bounds itself to 12 writes in flight,
# and the one live reader of the demo there (demo-seed.test.ts) can no longer
# catch it half-built: the account is born suppressed (createAccount's
# outboundSuppressed).
concurrency:
  group: e2e-ci-supabase
  cancel-in-progress: false
  queue: max

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The CI project, exactly as ci.yml names it: literals for what is not
    # secret (ci-workflow.test.ts pins that the two files agree), the CI_*
    # secrets mapped onto the names the code reads, and no production secret
    # at all. The guard step below refuses the run if any of it names
    # production.
    env:
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      BIS_CI_SUPABASE_REF: odnobiodsftffphuuosz
      NEXT_PUBLIC_SUPABASE_URL: https://odnobiodsftffphuuosz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TjstwU6y9KPtV8XD4BSFrw_WaNtv0Qc
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5

      # ci.yml's own guard: every value present, none naming production, the
      # URL exactly the ref's, the DB URL the CI project's pooler. This job
      # re-seeds an account and mints a Clerk user, so it gets the same check.
      - name: Check that the capture targets the CI Supabase project
        run: bash .github/scripts/ci-target-guard.sh

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Default on, because a capture of a stale demo is a dashboard whose
      # "this week" panels are honestly empty — the product looking broken.
      - name: Re-seed the demo tenant
        if: ${{ inputs.reseed }}
        run: pnpm --filter @bis/db db:seed-demo

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The config's webServer builds and starts the app itself.
      - name: Capture
        run: pnpm --filter web screenshots

      # The PNGs only: pixels of the seeded, outbound-suppressed demo tenant,
      # made for the public website. The signed-in session that took them is
      # in screenshots/.auth/, outside this directory, and stays on the runner.
      #
      # NO TRACE UPLOAD (2026-10-07), for the reason ci.yml's e2e job gives:
      # the repo is public, so are its artifacts, and a trace carries session
      # cookies and network bodies. A failed capture is read from the
      # Capture step's log, or reproduced locally with
      # `pnpm --filter web screenshots` (traces land in apps/web/test-results/).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-screenshots
          path: apps/web/screenshots/out/
          if-no-files-found: error
          retention-days: 14
