name: CI

# Why this exists: until 2026-09-06 every gate in this repo ran only when a
# human remembered to run it in a terminal. The booking redesign (#23) shipped
# with an e2e spec still waiting on a loading placeholder the redesign had
# removed, and nobody knew until the author ran the suite by hand. The guards
# this repo relies on protect nothing unless something runs them on every push.
#
# WHERE THE GATES RUN. Both jobs write to a Supabase database: `pnpm check`
# runs the packages/db suite (hundreds of live tests that create and delete
# their own rows), and e2e creates a fixture client and drives a real browser
# through it. Until 2026-09-24 that database was PRODUCTION's project,
# because it was the only one. They now run on a separate Free project that
# exists only for CI, `bis-ci` (BIS_CI_SUPABASE_REF below), built from the
# migration files by .github/workflows/ci-project-setup.yml and seeded by
# `ci:seed`. Of the workflows on main, only seed-demo.yml and
# screenshots.yml still reach production, through the non-CI_ secrets. (A
# LOCAL test runs now refuse production too, since #135: they throw before
# connecting when their env files name production's ref.)
# Rebuilding, restoring or re-seeding the CI project:
# docs/runbooks/ci-supabase-project.md.
#
# The switch is enforced, not assumed. Every job runs
# .github/scripts/ci-target-guard.sh straight after checkout: it refuses any
# value that names production, a DB URL that is not the CI project's Session
# pooler user, a Clerk key from the production instance, and a secret key
# that does not open the CI project's REST API. The repository secrets that
# hold production's values — the ones NAMED NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY and SUPABASE_DB_URL — are never read here;
# apps/web/ci/ci-workflow.test.ts fails `pnpm check` if one ever is.
#
#   verify  typecheck + lint + unit tests + production build. This is exactly
#           `pnpm check` and `pnpm --filter web build` from CLAUDE.md, no
#           more and no less, so CI and a contributor's terminal cannot
#           disagree about what "green" means. The guard in front of them is
#           a preflight, not a gate.
#
#   e2e     seeds the CI project (idempotent; a no-op once seeded), then the
#           Playwright journey. Serialized ACROSS THE WHOLE REPO, never
#           cancelled: every run shares the one seeded account ("Test Client
#           One") and specs drag its pipeline card, create forms and leads on
#           it and read its unread counts, so two runs at once race each
#           other. A second push while one e2e run is live waits for it.
#           (GitHub keeps at most one pending run per group, so a THIRD push
#           within the same window cancels the second's e2e job — re-run it
#           from the Actions tab if that ever bites.)
#
# Both jobs REFUSE to run without their credentials, naming what is missing
# (the guard's check 1). A gate that quietly skips when it cannot run is how
# the pre-CI state came about in the first place.

on:
  push:
  workflow_dispatch:

env:
  # Not secrets. Only what the gates actually need to RUN belongs here.
  # APP_ORIGIN and EMAIL_FROM were set in the first draft, on the reasoning
  # that CI should mirror the deployment; they are runtime configuration, and
  # mirroring them changed what the gates measure. APP_ORIGIN is read ahead of
  # the Host header by design, so it inverted eleven link-building tests and
  # pointed the e2e run's cancel links at the production domain instead of the
  # local server. A gate must test the code, not the deployment's settings.
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  # The CI project, as literals so the target is visible in review. The ref is
  # the one allowlist every CI-only tool checks against (the guard, ci:seed,
  # db:push:ci); the URL must be exactly https://<ref>.supabase.co. The
  # publishable key is publishable by design. All three must name the same
  # project as ci-project-setup.yml's env (pinned by ci-workflow.test.ts).
  BIS_CI_SUPABASE_REF: odnobiodsftffphuuosz
  NEXT_PUBLIC_SUPABASE_URL: https://odnobiodsftffphuuosz.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TjstwU6y9KPtV8XD4BSFrw_WaNtv0Qc
  # Secrets. Sending is FAKE everywhere except VERCEL_ENV=production
  # (.env.example), so a CI run never emails a real address. The secret key
  # and DB URL are the CI project's (CI_* secrets; SUPABASE_DB_URL is its
  # Session pooler URI, since runners have no IPv6), mapped onto the names the
  # code reads; the db suite, one web test, ci:seed and the e2e fixture setup
  # use them to create and delete their own rows. Clerk stays the development
  # instance, which the guard enforces.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
  SUPABASE_DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # 35, not 20. The first green run spent 15m30s in `pnpm check` alone —
    # the packages/db suite is live network work against Supabase, and a
    # runner is a slower, more distant client than a dev machine (the same
    # command takes ~3 minutes locally). 20 left under four minutes of
    # headroom, which is a gate that eventually fails on wall clock and
    # trains everyone to re-run red CI without reading it. The CI project is
    # a Free project on the smallest compute; it has not been timed there yet.
    timeout-minutes: 35
    concurrency:
      # ONE group for the whole repo, never cancelled — the same semantics
      # this job had on production's project, under a new name.
      #
      # Why one group: two db suites against one project at once is
      # contention, and contention fails on wall clock. On 2026-09-17
      # `feat/sms-opt-out` and `feat/call-handoff` overlapped for 13.5 minutes
      # and BOTH failed inside `pnpm check`; a re-run failed on a DIFFERENT
      # test, which is the signature of contention rather than a defect (db
      # round trips measured 10-20s contended, ~2.2s alone). The fixture data
      # itself does not collide — ids are random and the sweep only takes
      # rows older than an hour — so this is about capacity, and the Free
      # project has less of it than production had.
      #
      # Why never cancelled: a group is repo-wide, so cancelling would let a
      # push on one branch kill a DIFFERENT branch's verify mid-db-suite; and
      # a cancelled run on main means the commit being DEPLOYED never
      # finished being checked (#62 and #64 each had their main run killed by
      # the next merge). GitHub keeps at most one PENDING run per group, so
      # the worst case is one running plus one waiting.
      #
      # Why a new name: a branch that has not merged main yet still carries
      # the old ci.yml, which runs on production's project under the old
      # group names. The two queues no longer share a database, so they must
      # not block each other.
      #
      # Next (plan stage 2, only after two concurrent runs are measured on
      # the CI project): a per-branch group, cancelling superseded runs on
      # branches but never on main. It is safe now in a way it was not on
      # production — a cancelled run's stranded fixtures land in the CI
      # project, where the next run's sweep reclaims them.
      group: verify-ci-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Before `pnpm install` and before anything touches a database. Needs
      # only bash and curl. Names every problem it finds, prints no value.
      - name: Check that CI targets the CI Supabase project
        run: bash .github/scripts/ci-target-guard.sh

      # Reads the pinned version from package.json's "packageManager" field, so
      # bumping pnpm is one edit, not two.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm check` = typecheck + lint + every package's vitest suite,
      # verbatim from CLAUDE.md. The db suite and one web test are live
      # against the CI project and clean up after themselves.
      - name: pnpm check
        run: pnpm check

      # Catches the class `tsc` cannot: Next evaluates route modules during
      # page-data collection. Vercel builds only on main, so without this a
      # branch can look green and break the production deploy on merge.
      - name: Production build
        run: pnpm --filter web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AFTER verify, not alongside it. On production's project, verify and e2e
    # started within a second of each other and raced for the one database.
    # What it cost, on b9f31dc (the merge commit for #85) — the SAME TREE that
    # had just passed both jobs on its own branch:
    #
    #   run 1  auth.setup.ts:93        page.goto("/") exceeded 30s
    #   run 2  blueprints.spec.ts:29   a 10s visibility timeout
    #   run 3  auth.setup.ts:51        a bare 30s test timeout
    #
    # A DIFFERENT test each time and EVERY ONE a wall-clock timeout, never an
    # assertion: contention, not a defect. The CI project removes production
    # traffic and the production deploy from that contention, but not the
    # other job; on the smallest Free compute the two jobs would still compete.
    #
    # "needs" rather than one shared concurrency group across both jobs, and
    # the difference matters. A shared group would serialize them, but GitHub
    # keeps only ONE PENDING run per group and cancels the older pending one —
    # so a third push inside the window would silently drop a middle commit's
    # gate entirely. "needs" orders the two jobs WITHIN a run, and leaves each
    # job's own group to handle whole runs racing each other.
    #
    # THE COST: a push takes about eighteen minutes instead of twelve, because
    # e2e waits instead of running alongside. The gain is that "green" means
    # something. And e2e no longer runs at all when verify is already red, so
    # it stops burning a runner on a commit that cannot merge.
    needs: verify
    # The one e2e test that calls the model (concierge.spec.ts, "a visitor's
    # message comes back with a reply") skips itself when this is unset — so
    # until 2026-09-21 no machine had ever proved a real answer comes back
    # (the first proof was a person, in a browser, on Test Client One).
    # Scoped to THIS job on purpose: the unit suites under `verify` stub or
    # clear the key themselves, and a job that never talks to OpenAI should
    # not carry the credential. The secret is a separate CI key (`bis-ci`),
    # revocable on its own; the cost is one short model call per run. When
    # the secret is absent the expression is an empty string, which the
    # test treats as unset, so this line is safe to merge ahead of the key.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Stripe TEST mode only. e2e/plans.spec.ts creates a product and four
      # prices with it, and skips itself with a ::warning when it is unset.
      # The target guard (check 6) runs second, right after checkout, and
      # refuses a live key before any other step runs.
      # Scoped to this job for the same reason as OPENAI_API_KEY above.
      STRIPE_SECRET_KEY: ${{ secrets.CI_STRIPE_SECRET_KEY }}
    concurrency:
      # Serialized repo-wide and never cancelled; see the header. A new name
      # for the reason verify's has one: branches still on the old ci.yml run
      # e2e on production's project under `e2e-shared-supabase` (which the
      # seed-demo and screenshots workflows also take), and this queue must
      # neither wait for nor block theirs.
      group: e2e-ci-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Same guard as verify, for the same reason: this job creates and
      # deletes rows AND Clerk users.
      - name: Check that CI targets the CI Supabase project
        run: bash .github/scripts/ci-target-guard.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The account every run shares ("Test Client One", its contact, its
      # "Sales" pipeline and card, its custom field, one inert number). Adds
      # only what is missing and never updates or deletes, so on a seeded
      # project it writes nothing. It then verifies every row the specs assume
      # and fails naming what is missing: an unseeded project is a red job
      # here, not a run of specs that skip. Runs its own target check first
      # (packages/db/src/ci/target.ts).
      - name: Seed the CI project
        run: pnpm --filter @bis/db ci:seed

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # playwright.config.ts builds and starts the production server itself
      # (`pnpm build && pnpm start`), signs in as the agency admin through a
      # Clerk sign-in token, creates a per-run fixture client, runs every
      # spec serially, and deletes the fixture in teardown. Stale fixtures a
      # killed run left behind are swept at the top of the next run.
      - name: Playwright
        run: pnpm --filter web test:e2e

      # Traces are retained only on failure (playwright.config.ts), so this
      # is empty on a green run and skipped.
      - name: Upload traces from failed specs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
