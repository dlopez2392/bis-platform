name: CI

# Why this exists: until 2026-09-06 every gate in this repo ran only when a
# human remembered to run it in a terminal. The booking redesign (#23) shipped
# with an e2e spec still waiting on a loading placeholder the redesign had
# removed, and nobody knew until the author ran the suite by hand. The guards
# this repo relies on protect nothing unless something runs them on every push.
#
# WHERE THE GATES RUN. Both jobs write to a Supabase database: `pnpm check`
# runs the packages/db suite (hundreds of live tests that create and delete
# their own rows), and e2e creates a fixture client and drives a real browser
# through it. Until 2026-09-24 that database was PRODUCTION's project,
# because it was the only one. Since then:
#
#   verify  (since 2026-10-08) a throwaway Supabase stack started INSIDE its
#           own runner by `supabase start`, built from the branch's own
#           migration files in the CI project's order (bootstrap, then
#           migrations; .github/scripts/ci-local-supabase.sh), and gone when
#           the runner is. It shares nothing with any other run, so it waits
#           for nobody (no job-level concurrency group, below).
#   e2e     the separate Free project that exists only for CI, `bis-ci`
#           (BIS_CI_SUPABASE_REF in e2e's env), built from the migration files
#           by .github/workflows/ci-project-setup.yml and seeded by `ci:seed`.
#           It stays there because it signs in through the Clerk development
#           instance, which that project trusts and a local stack does not.
#
# Of the workflows on main, only seed-demo.yml and screenshots.yml still
# reach production's database, through the non-CI_ secrets held by the
# `production` environment (main only); neither job here declares that
# environment, so neither can read them. (LOCAL test runs refuse production
# too, since #135: they throw before connecting when their env files name
# production's ref.) Rebuilding, restoring or re-seeding the CI project:
# docs/runbooks/ci-supabase-project.md.
#
# The targets are enforced, not assumed, by .github/scripts/ci-target-guard.sh
# straight after checkout in both jobs. In e2e it refuses any value that
# names production, a DB URL that is not the CI project's Session pooler user,
# a Clerk key from the production instance, and a secret key that does not
# open the CI project's REST API. In verify it runs twice: first
# (--before-local-stack) it refuses ANY Supabase value already in scope, so
# no cloud credential reaches verify at all, and then, once the stack is up
# (--local-stack), it refuses any API or DB URL that is not on the runner's
# loopback. The secrets that hold production's values — the ones NAMED
# NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and SUPABASE_DB_URL —
# are never read here; apps/web/ci/ci-workflow.test.ts fails `pnpm check` if
# one ever is.
#
#   verify  typecheck + lint + unit tests + production build. This is exactly
#           `pnpm check` and `pnpm --filter web build` from CLAUDE.md, no
#           more and no less, so CI and a contributor's terminal cannot
#           disagree about what "green" means. The guard runs and the stack
#           in front of them are preflights, not gates.
#
#   e2e     seeds the CI project (idempotent; a no-op once seeded), then the
#           Playwright journey. Serialized ACROSS THE WHOLE REPO, never
#           cancelled: every run shares the one seeded account ("Test Client
#           One") and specs drag its pipeline card, create forms and leads on
#           it and read its unread counts, so two runs at once race each
#           other. A second push while one e2e run is live waits for it, in
#           a FIFO line (`queue: max`) — since 2026-10-07 a push on another
#           branch no longer cancels a job that is waiting.
#
# Both jobs REFUSE to run without their credentials, naming what is missing
# (the guard's check 1). A gate that quietly skips when it cannot run is how
# the pre-CI state came about in the first place.
#
# The one sanctioned skip (2026-10-07): a push to a branch whose WHOLE diff
# against main is docs still runs both jobs to a green end, but stops after
# the guard and .github/scripts/ci-docs-only.sh — no install, no suites, no
# build, no Playwright, so no Supabase traffic. It is loud (a ::notice:: on
# the run), never applies to a push to main, and any doubt means the full run.

on:
  push:
  workflow_dispatch:

# WHO MAY CANCEL WHOM (2026-10-07). Two layers, because GitHub's concurrency
# groups can either queue or cancel, never both in one group (`queue: max`
# with `cancel-in-progress: true` is a validation error).
#
#   This one, per run: one group per branch ref, cancelling. A newer push to a
#   branch stops that SAME branch's older run, running or waiting, and with it
#   the Supabase traffic it was making (a cancelled run's fixtures are swept by
#   a later run once they are an hour old). Another branch is another group,
#   so it is never touched. On main every run is its own group (the run id)
#   and nothing cancels it: main's run is the checked state of the commit
#   being deployed (#62 and #64 each had theirs killed by the next merge).
#   Re-running an OLD run of a branch joins that branch's group too, so it
#   cancels the branch's current run; re-run the newest one instead.
#
#   e2e's own group (below), repo-wide and queueing: different branches wait
#   in line for the one CI database, FIFO, up to 100 deep. Until this date it
#   used the default `queue: single`, which keeps ONE waiting entry and
#   cancels it when another arrives, so a push on any branch cancelled
#   whichever other branch's job was waiting (about five times that day).
#
#   verify has NO group of its own since 2026-10-08. It had one,
#   `verify-ci-supabase`, repo-wide, because every verify ran its db suite
#   against the one shared cloud project and two at once failed on wall clock
#   (2026-09-17: two branches overlapped 13.5 minutes and both failed inside
#   `pnpm check`). That made it the bottleneck: with three or four runs
#   queued, the last waited about 45 minutes before starting. Each verify now
#   runs on a stack inside its own runner, so there is nothing to contend for
#   and branches' verify runs go in parallel. The per-branch group above
#   still supersedes a branch's own stale run, and still never cancels main.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Not secrets. Only what the gates actually need to RUN belongs here.
  # APP_ORIGIN and EMAIL_FROM were set in the first draft, on the reasoning
  # that CI should mirror the deployment; they are runtime configuration, and
  # mirroring them changed what the gates measure. APP_ORIGIN is read ahead of
  # the Host header by design, so it inverted eleven link-building tests and
  # pointed the e2e run's cancel links at the production domain instead of the
  # local server. A gate must test the code, not the deployment's settings.
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  # Secrets both jobs need. Sending is FAKE everywhere except
  # VERCEL_ENV=production (.env.example), so a CI run never emails a real
  # address. Clerk stays the development instance, which the guard enforces.
  #
  # NO Supabase value lives here (since 2026-10-08). verify reads its four
  # from the stack it starts; the CI project's are in e2e's own env. A value
  # here would reach verify too: ci-target-guard.sh --before-local-stack
  # refuses that at run time, and ci-workflow.test.ts in review.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # 35, not 20, set when the db suite ran against the shared cloud project:
    # the first green run spent 15m30s in `pnpm check` alone, because every
    # db test was a round trip to us-east-1 from a runner. On the local stack
    # (2026-10-08) those round trips are loopback; lower this once enough
    # runs have been timed there to know the new headroom.
    timeout-minutes: 35
    # NO `concurrency:` here, on purpose (2026-10-08). verify used to join one
    # repo-wide group, `verify-ci-supabase`, because every run shared one cloud
    # database; see the header. Its database is now its own, so it runs the
    # moment a runner is free. ci-workflow.test.ts fails if a group returns.
    steps:
      - uses: actions/checkout@v5

      # Before `pnpm install` and before anything touches a database. Needs
      # only bash. Names every problem it finds, prints no value. Here it
      # refuses any Supabase value at all: verify has none until its own
      # stack writes them, three steps below.
      - name: Check that verify holds no cloud Supabase credential
        run: bash .github/scripts/ci-target-guard.sh --before-local-stack

      # DOCS-ONLY PUSHES END HERE, GREEN. Writes docs_only=true only for a
      # push to a branch other than main whose WHOLE diff against main is
      # docs (*.md, docs/**, .claude/**, LICENSE, .github/ISSUE_TEMPLATE/**,
      # never a code extension, never a workflow); every step below is then
      # skipped and the job still ends `success` on the head SHA, which is
      # what the ruleset on main requires. Anything else, any doubt and any
      # error mean `false`: the full run. Why it exists, and why a step and
      # not a path filter or a job-level `if:`: the script's header.
      # Every later step carries the same condition, written `!= 'true'` so a
      # missing output runs everything (pinned by ci-workflow.test.ts).
      - name: Decide whether this push changes only docs
        id: scope
        run: bash .github/scripts/ci-docs-only.sh

      # Reads the pinned version from package.json's "packageManager" field, so
      # bumping pnpm is one edit, not two. v6 (not v4): v4 runs its own code on
      # Node 20, which GitHub now force-runs on Node 24 anyway and warns about
      # every job ("Node.js 20 is deprecated … pnpm/action-setup@v4" — a run on
      # this repo, 2026-09-25); v6's action.yml already declares `node24`, so
      # the warning is gone rather than papered over. v5/v6 changed nothing
      # this bare (no-`with:`) usage relies on.
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.docs_only != 'true'

      # The Supabase CLI at the version pnpm-lock.yaml pins for packages/db,
      # from its release tarball, refused unless its sha256 is the one pinned
      # in the script. Not an action: see the script's header.
      - name: Install the Supabase CLI
        if: steps.scope.outputs.docs_only != 'true'
        run: bash .github/scripts/ci-supabase-cli.sh

      # verify's database, inside this runner: `supabase start` with no
      # migrations, then the CI project's bootstrap, then the branch's own
      # migrations by `supabase db push`, in that order (grants attach when a
      # table is created). Writes the stack's URL, keys and DB URL to
      # GITHUB_ENV for the steps below, and reports how long each part took.
      - name: Start a local Supabase stack
        if: steps.scope.outputs.docs_only != 'true'
        run: bash .github/scripts/ci-local-supabase.sh

      # The same guard, now on the values the suites will actually read: the
      # API and DB URL must be this runner's loopback, and the stack's REST
      # API must answer with its service key.
      - name: Check that verify targets its local Supabase stack
        if: steps.scope.outputs.docs_only != 'true'
        run: bash .github/scripts/ci-target-guard.sh --local-stack

      # `pnpm check` = typecheck + lint + every package's vitest suite,
      # verbatim from CLAUDE.md. The db suite and the live web tests run
      # against the local stack and clean up after themselves.
      - name: pnpm check
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm check

      # Catches the class `tsc` cannot: Next evaluates route modules during
      # page-data collection. Vercel builds only on main, so without this a
      # branch can look green and break the production deploy on merge.
      - name: Production build
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AFTER verify, not alongside it. On production's project, verify and e2e
    # started within a second of each other and raced for the one database.
    # What it cost, on b9f31dc (the merge commit for #85) — the SAME TREE that
    # had just passed both jobs on its own branch:
    #
    #   run 1  auth.setup.ts:93        page.goto("/") exceeded 30s
    #   run 2  blueprints.spec.ts:29   a 10s visibility timeout
    #   run 3  auth.setup.ts:51        a bare 30s test timeout
    #
    # A DIFFERENT test each time and EVERY ONE a wall-clock timeout, never an
    # assertion: contention, not a defect. The CI project removes production
    # traffic and the production deploy from that contention, but not the
    # other job; on the smallest Free compute the two jobs would still compete.
    #
    # "needs" rather than one shared concurrency group across both jobs, and
    # the difference matters. A shared group would serialize them, but GitHub
    # keeps only ONE PENDING run per group and cancels the older pending one —
    # so a third push inside the window would silently drop a middle commit's
    # gate entirely. "needs" orders the two jobs WITHIN a run, and leaves each
    # job's own group to handle whole runs racing each other.
    #
    # THE COST: a push takes about eighteen minutes instead of twelve, because
    # e2e waits instead of running alongside. The gain is that "green" means
    # something. And e2e no longer runs at all when verify is already red, so
    # it stops burning a runner on a commit that cannot merge.
    #
    # Since 2026-10-08 verify no longer touches the CI project at all (it runs
    # on a stack in its own runner), so the contention above is gone; `needs`
    # stays for the last reason alone. Starting e2e alongside verify is a
    # separate decision, not made here.
    needs: verify
    env:
      # The CI project, as literals so the target is visible in review. The
      # ref is the one allowlist every CI-only tool checks against (the guard,
      # ci:seed, db:push:ci); the URL must be exactly https://<ref>.supabase.co.
      # The publishable key is publishable by design. All three must name the
      # same project as ci-project-setup.yml's env (pinned by
      # ci-workflow.test.ts). In THIS job's env, not the workflow's, since
      # 2026-10-08: verify runs on its own stack and must not hold them.
      BIS_CI_SUPABASE_REF: odnobiodsftffphuuosz
      NEXT_PUBLIC_SUPABASE_URL: https://odnobiodsftffphuuosz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TjstwU6y9KPtV8XD4BSFrw_WaNtv0Qc
      # The CI project's secret key and DB URL (CI_* secrets; SUPABASE_DB_URL
      # is its Session pooler URI, since runners have no IPv6), mapped onto
      # the names the code reads; ci:seed and the e2e fixture setup use them
      # to create and delete their own rows.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.CI_SUPABASE_DB_URL }}
      # The one e2e test that calls the model (concierge.spec.ts, "a visitor's
      # message comes back with a reply") skips itself when this is unset — so
      # until 2026-09-21 no machine had ever proved a real answer comes back
      # (the first proof was a person, in a browser, on Test Client One).
      # Scoped to THIS job on purpose: the unit suites under `verify` stub or
      # clear the key themselves, and a job that never talks to OpenAI should
      # not carry the credential. The secret is a separate CI key (`bis-ci`),
      # revocable on its own; the cost is one short model call per run. When
      # the secret is absent the expression is an empty string, which the
      # test treats as unset, so this line is safe to merge ahead of the key.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Stripe TEST mode only. e2e/plans.spec.ts creates a product and four
      # prices with it, and skips itself with a ::warning when it is unset.
      # The target guard (check 6) runs second, right after checkout, and
      # refuses a live key before any other step runs.
      # Scoped to this job for the same reason as OPENAI_API_KEY above.
      STRIPE_SECRET_KEY: ${{ secrets.CI_STRIPE_SECRET_KEY }}
      # NOT a secret: a fixed literal the e2e billing spec signs its own
      # fixture webhook events with, so the e2e server accepts them. It
      # verifies nothing anywhere else: production's signing secret is set
      # on Vercel Production only (M7a PR-3 plan, Task 13).
      STRIPE_WEBHOOK_SECRET: whsec_bis_ci_e2e_fixture_only
      # NOT a secret: the PUBLIC half of a fixed test key whose private half
      # lives in e2e/consent-texts.spec.ts, so the e2e server accepts that
      # spec's signed SMS webhooks. Production's TELNYX_PUBLIC_KEY is set on
      # Vercel Production only and is a different key.
      TELNYX_PUBLIC_KEY: lW4zmAKH3ZvWpUaw9UO78RQpX8fUhVcP0vvuEaUxS0w=
      # NOT a secret: a fixed literal the e2e server seals its unsubscribe
      # links with, and e2e/consent-email.spec.ts mints its tokens with, so
      # the spec can open /u/<token> and POST the one-click endpoint.
      # Production's CONSENT_TOKEN_SECRET is set on Vercel Production only
      # (consent PR-3 plan, Task 15) and is a different value.
      CONSENT_TOKEN_SECRET: bis_ci_e2e_consent_token_fixture_only
    concurrency:
      # Serialized repo-wide and never cancelled; see the header. A new name
      # (2026-09-24) because branches still on the older ci.yml ran e2e on
      # production's project under `e2e-shared-supabase` (which the
      # seed-demo and screenshots workflows also take), and this queue must
      # neither wait for nor block theirs.
      # `queue: max` (2026-10-07): the default keeps ONE waiting job per group
      # and cancels it when another arrives, so a push on any branch cancelled
      # a different branch's waiting e2e. Parallel e2e is NOT safe — every run
      # shares Test Client One — so the line stays one repo-wide queue; it
      # just no longer drops the job waiting in it.
      group: e2e-ci-supabase
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5

      # Same guard as verify, for the same reason: this job creates and
      # deletes rows AND Clerk users.
      - name: Check that CI targets the CI Supabase project
        run: bash .github/scripts/ci-target-guard.sh

      # The same decision as verify's, made again here rather than read from
      # verify's outputs, so each job's skip is visible in its own log. Same
      # inputs (the event, the ref, the branch's diff against main), same answer.
      - name: Decide whether this push changes only docs
        id: scope
        run: bash .github/scripts/ci-docs-only.sh

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.docs_only != 'true'

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.docs_only != 'true'

      # The account every run shares ("Test Client One", its contact, its
      # "Sales" pipeline and card, its custom field, one inert number). Adds
      # only what is missing and never updates or deletes, so on a seeded
      # project it writes nothing. It then verifies every row the specs assume
      # and fails naming what is missing: an unseeded project is a red job
      # here, not a run of specs that skip. Runs its own target check first
      # (packages/db/src/ci/target.ts).
      - name: Seed the CI project
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter @bis/db ci:seed

      # Bounded, with one retry. On PR #162 (run 36885435767, attempt 2) this
      # step hung inside `apt-get update` on an Ubuntu mirror for the job's
      # whole 30 minutes and was cancelled before a single spec ran; a normal
      # install takes about a minute. Each attempt gets 6 minutes, a second
      # attempt covers a mirror that recovers, and the step's own cap makes a
      # hang a fast, clearly named failure rather than a cancelled job.
      - name: Install Chromium for Playwright
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 14
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=20s 6m pnpm --filter web exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt $attempt failed or exceeded 6 minutes"
            sleep 15
          done
          echo "::error::Chromium install failed twice; see the apt output above"
          exit 1

      # playwright.config.ts builds and starts the production server itself
      # (`pnpm build && pnpm start`), creates a per-run agency user and a
      # per-run fixture client and signs each in with a Clerk sign-in ticket,
      # runs every spec serially, and deletes both in teardown. Stale fixtures
      # a killed run left behind are swept at the top of the next run.
      #
      # NO TRACE UPLOAD, on purpose (2026-10-07). This repo is public, so its
      # Actions artifacts are downloadable by any signed-in GitHub user, and a
      # Playwright trace carries the run's session cookies and network bodies.
      # A red run is read from this step's own log (the list reporter prints
      # each failing assertion and its location); to step through a trace,
      # reproduce locally — `pnpm --filter web test:e2e` keeps failed specs'
      # traces in apps/web/test-results/ (docs/runbooks/ci-supabase-project.md).
      # apps/web/ci/ci-workflow.test.ts fails `pnpm check` if one comes back.
      - name: Playwright
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm --filter web test:e2e
