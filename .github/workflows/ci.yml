name: CI

# Why this exists: until 2026-09-06 every gate in this repo ran only when a
# human remembered to run it in a terminal. The booking redesign (#23) shipped
# with an e2e spec still waiting on a loading placeholder the redesign had
# removed, and nobody knew until the author ran the suite by hand. The guards
# this repo relies on protect nothing unless something runs them on every push.
#
# Two jobs. The ORIGINAL split criterion below — "whether the work touches
# the shared Supabase project" — IS WRONG, and it is left standing because
# the correction is the useful part: BOTH jobs touch it. `pnpm check` runs 423
# live tests against that project. Treating verify as though it did not is the
# assumption behind #82's fix and behind the `needs: verify` on e2e; the real
# difference between these two jobs is only what they each do with the project.
#
# (see CLAUDE.md: e2e and production share one project):
#
#   verify  typecheck + lint + unit tests + production build. This is exactly
#           `pnpm check` and `pnpm --filter web build` from CLAUDE.md, no
#           more and no less, so CI and a contributor's terminal cannot
#           disagree about what "green" means. Serialized ACROSS THE WHOLE
#           REPO and never cancelled, for the same reason e2e is: `pnpm
#           check` runs the packages/db suite, which is live network work
#           against that one shared project.
#
#   e2e     the Playwright journey. Serialized ACROSS THE WHOLE REPO, never
#           cancelled: two runs against the one shared database at the same
#           time would race on the fixture account and on the agency user's
#           persisted preferences. A second push while one e2e run is live
#           waits for it. (GitHub keeps at most one pending run per group, so
#           a THIRD push within the same window cancels the second's e2e job —
#           re-run it from the Actions tab if that ever bites.)
#
# Both jobs need the same five secrets — the values from apps/web/.env.local —
# and REFUSE to run without them, naming what is missing. A gate that quietly
# skips when it cannot run is how the pre-CI state came about in the first
# place.

on:
  push:
  workflow_dispatch:

env:
  # Not secrets — the same literals .env.example carries for every developer.
  # Only what the gates actually need to RUN belongs here. APP_ORIGIN and
  # EMAIL_FROM were set in the first draft, on the reasoning that CI should
  # mirror the deployment; they are runtime configuration, and mirroring them
  # changed what the gates measure. APP_ORIGIN is read ahead of the Host
  # header by design, so it inverted eleven link-building tests and pointed
  # the e2e run's cancel links at the production domain instead of the local
  # server. A gate must test the code, not the deployment's settings.
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_h2GmSCjLzD74RotkQAvMbA_BL6FAI4k
  # Secrets. Sending is FAKE everywhere except VERCEL_ENV=production
  # (.env.example), so a CI run never emails a real address; the service-role
  # key and DB URL are what the db suite, one web test, and the e2e fixture
  # setup use to create and delete their own per-run rows.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # 35, not 20. The first green run spent 15m30s in `pnpm check` alone —
    # the packages/db suite is live network work against Supabase, and a
    # runner is a slower, more distant client than a dev machine (the same
    # command takes ~3 minutes locally). 20 left under four minutes of
    # headroom, which is a gate that eventually fails on wall clock and
    # trains everyone to re-run red CI without reading it.
    timeout-minutes: 35
    concurrency:
      # ONE group for the whole repo, exactly like e2e below — not
      # `verify-${{ github.ref }}`, which is what this was and what broke.
      #
      # `pnpm check` runs the packages/db suite, and that suite is live
      # network work against the one Supabase project that also serves
      # production. Keyed on the branch, two branches ran two db suites
      # against that project simultaneously. This job's own comments already
      # conceded "the db suite and one web test are live against the shared
      # Supabase project" and blamed a previous wall-clock failure on
      # "contention" — without drawing the conclusion e2e had already drawn.
      #
      # What it cost, on 2026-09-17: `feat/sms-opt-out` (verify 02:14:52—
      # 02:28:37) and `feat/call-handoff` (02:15:11—02:30:48) overlapped for
      # 13.5 minutes and BOTH failed inside `pnpm check`. A re-run of the
      # first, which again caught the tail of the second, failed on a
      # DIFFERENT test. Different test each time is the signature of
      # contention, not of a defect — and the timings agree: db round trips
      # measured 10-20s each while contended and ~2.2s once alone. Every
      # such kill also strands fixture rows, because a suite stopped
      # mid-test never reaches its `finally`.
      #
      # cancel-in-progress: false, and this is the part that needs saying.
      # The obvious "fix" — one group, keep cancelling — is WORSE than the
      # race it replaces: a group is repo-wide, so a push on one branch
      # would cancel a DIFFERENT branch's running verify, killing someone
      # else's gate mid-db-suite and stranding its fixtures. GitHub gives
      # one group and one cancel flag per job, so "cancel my own branch's
      # older run, queue everyone else's" is not expressible. Correctness
      # wins: nothing is cancelled, and a superseded run on the same branch
      # now finishes instead of being killed. e2e has run this way since it
      # was written.
      #
      # This still does not queue without bound. GitHub keeps at most one
      # PENDING run per group and cancels the older pending one, so the
      # worst case is one running plus one waiting — and a run cancelled
      # before it ever starts has nothing to leak.
      #
      # The original reason this job avoided cancelling on main is unchanged
      # and now covers every ref: a cancelled run means the commit being
      # DEPLOYED never finished being checked. Merging #62 and #64 each had
      # their main run killed by the next merge (runs #107 and #109, both
      # `cancelled`), so nothing established either commit was green — and
      # pushing to main deploys production.
      #
      # The real fix is a CI Supabase project separate from production's.
      # Until that exists, this is the cheap half of it, and the cost is
      # wall clock when several branches are in flight rather than a gate
      # whose answer depends on who else happened to push.
      group: verify-shared-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Check that the repository secrets are configured
        run: |
          missing=""
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions, using the values from apps/web/.env.local."
            exit 1
          fi

      # Reads the pinned version from package.json's "packageManager" field, so
      # bumping pnpm is one edit, not two.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm check` = typecheck + lint + every package's vitest suite,
      # verbatim from CLAUDE.md. The db suite and one web test are live
      # against the shared Supabase project and clean up after themselves.
      - name: pnpm check
        run: pnpm check

      # Catches the class `tsc` cannot: Next evaluates route modules during
      # page-data collection. Vercel builds only on main, so without this a
      # branch can look green and break the production deploy on merge.
      - name: Production build
        run: pnpm --filter web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AFTER verify, not alongside it. #82 serialized verify against OTHER
    # VERIFY RUNS and stopped there — but verify and e2e are separate
    # concurrency groups, so on every push they started within a second of
    # each other and raced for the one Supabase project regardless.
    #
    # What it cost, on b9f31dc (the merge commit for #85) — the SAME TREE that
    # had just passed both jobs on its own branch:
    #
    #   run 1  auth.setup.ts:93        page.goto("/") exceeded 30s
    #   run 2  blueprints.spec.ts:29   a 10s visibility timeout
    #   run 3  auth.setup.ts:51        a bare 30s test timeout
    #
    # A DIFFERENT test each time and EVERY ONE a wall-clock timeout, never an
    # assertion — the signature this file's own #82 comment names for
    # contention rather than a defect. Three consecutive reds on a commit that
    # was already serving production, which is precisely the state the
    # no-cancel rule above exists to prevent.
    #
    # main is worse than a branch, and that is the tell: a push to main runs
    # verify and e2e together AND the Vercel production deploy AND live
    # production traffic, all against the one project. A branch run has no
    # production deploy and no live traffic.
    #
    # "needs" rather than one shared concurrency group across both jobs, and
    # the difference matters. A shared group would serialize them, but GitHub
    # keeps only ONE PENDING run per group and cancels the older pending one —
    # so a third push inside the window would silently drop a middle commit's
    # gate entirely. "needs" orders the two jobs WITHIN a run, which is the
    # thing that was actually wrong, and leaves each job's own group to handle
    # whole runs racing each other.
    #
    # THE COST, stated rather than discovered later: a push goes from about
    # twelve minutes to about eighteen, because e2e waits instead of running
    # alongside. The gain is that "green" means something. A gate whose answer
    # depends on who else happened to push is how everyone learns to re-run
    # red CI without reading it — the habit the top of this file exists to
    # prevent.
    #
    # A SIDE EFFECT WORTH HAVING: e2e no longer runs at all when verify is
    # already red. It stops burning a runner on a commit that cannot merge,
    # and stops stranding e2e fixture rows in the shared project on runs that
    # were doomed before they started.
    #
    # The real fix remains a CI Supabase project separate from production's.
    # This is the other cheap half of it.
    needs: verify
    # The one e2e test that calls the model (concierge.spec.ts, "a visitor's
    # message comes back with a reply") skips itself when this is unset — so
    # until 2026-09-21 no machine had ever proved a real answer comes back
    # (the first proof was a person, in a browser, on Test Client One).
    # Scoped to THIS job on purpose: the unit suites under `verify` stub or
    # clear the key themselves, and a job that never talks to OpenAI should
    # not carry the credential. The secret is a separate CI key (`bis-ci`),
    # revocable on its own; the cost is one short model call per run. When
    # the secret is absent the expression is an empty string, which the
    # test treats as unset, so this line is safe to merge ahead of the key.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Check that the repository secrets are configured
        run: |
          missing=""
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions, using the values from apps/web/.env.local."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # playwright.config.ts builds and starts the production server itself
      # (`pnpm build && pnpm start`), signs in as the agency admin through a
      # Clerk sign-in token, creates a per-run fixture client, runs every
      # spec serially, and deletes the fixture in teardown. Stale fixtures a
      # killed run left behind are swept at the top of the next run.
      - name: Playwright
        run: pnpm --filter web test:e2e

      # Traces are retained only on failure (playwright.config.ts), so this
      # is empty on a green run and skipped.
      - name: Upload traces from failed specs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
